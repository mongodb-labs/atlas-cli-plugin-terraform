name: 'Code Health'

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

jobs:
  # TEMPORARY: validates ECR access for SilkBomb, remove before merge.
  silkbomb-ecr-access:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    env:
      ECR_REGISTRY: ${{ vars.ECR_REGISTRY }}
      ECR_ROLE_ARN: ${{ vars.ECR_ROLE_ARN }}
      SILKBOMB_IMG: ${{ vars.SILKBOMB_IMG }}
    steps:
    - name: Configure AWS credentials for DevProd Platforms ECR
      uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c
      with:
        role-to-assume: ${{ env.ECR_ROLE_ARN }}
        aws-region: us-east-1
    - name: Authenticate Docker to DevProd Platforms ECR
      run: |
        aws ecr get-login-password --region us-east-1 |
          docker login --username AWS --password-stdin "${ECR_REGISTRY}"
        docker pull "${SILKBOMB_IMG}"
    - name: Verify SilkBomb image is executable
      run: docker run --rm "${SILKBOMB_IMG}" --help

  build:
    runs-on: ubuntu-latest
    permissions: {}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
    - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
      with:
        go-version-file: 'go.mod'
    - name: Build
      run: make build
    - name: Unit Test
      run: make test

  e2e:
    runs-on: ubuntu-latest
    permissions: {}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
    - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
      with:
        go-version-file: 'go.mod'
    - name: setup Atlas CLI
      uses: mongodb/atlas-github-action@e3c9e0204659bafbb3b65e1eb1ee745cca0e9f3b
    - name: E2E Test
      run: make test-e2e
    
  lint:
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Install Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: 'go.mod'
          cache: false # see https://github.com/golangci/golangci-lint-action/issues/807
      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a
        with:
          version: v2.10.0 # Also update GOLANGCI_VERSION variable in Makefile when updating this version
      - name: actionlint
        run: |
          make tools
          echo "::add-matcher::.github/actionlint-matcher.json"
          actionlint -color
        shell: bash
      - name: shellcheck
        uses: bewuethr/shellcheck-action@80bac2daa9fcf95d648200a793d00060857e6dc4

  check-go-files:
      runs-on: ubuntu-latest
      permissions: {}
      steps:
        - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e    
          with:
            go-version-file: 'go.mod'  
        - run: go mod tidy
        - run: go fix ./...
        - name: Find mutations
          id: self_mutation
          run: |-
            git add .
            git diff --staged --patch --exit-code > doc.repo.patch || echo "self_mutation_happened=true" >> "${GITHUB_OUTPUT}"
        - name: Fail build on mutation
          if: steps.self_mutation.outputs.self_mutation_happened
          run: |-
            echo "::error::Files were changed. Make sure to run 'go mod tidy' and 'go fix ./...'"
            cat doc.repo.patch
            exit 1
